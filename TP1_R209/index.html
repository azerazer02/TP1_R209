<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP1 - Formulaire de Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="form-container">
        <h1>Formulaire de contact</h1>

        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="pseudo">Votre Pseudo <span class="required">*</span></label>
                <input type="text" id="pseudo" name="pseudo" placeholder="Ex: LucasNet" required> 
            </div>

            <div class="form-group">
                <label for="password">Votre Mot de passe <span class="required">*</span></label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="email">Votre adresse e-mail <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="exemple@domaine.fr" required> 
            </div>

            <div class="form-group">
                <label for="object">Objet du message <span class="required">*</span></label>
                <select id="object" name="object" required> 
                    <option value="" disabled selected>Choisissez une option...</option>
                    <option value="question">J'ai une question</option>
                    <option value="suggestion">Je fais une suggestion</option>
                    <option value="probleme">Je rencontre un problème</option>
                    <option value="autre">Autre</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Votre message <span class="required">*</span></label>
                <textarea id="message" name="message" rows="5" placeholder="Écrivez votre message ici..." required></textarea> 
            </div>

            <fieldset class="form-group">
                <legend>Niveau d'urgence <span class="required">*</span></legend>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="urgency" value="urgent"> Urgent
                    </label>
                    <label>
                        <input type="radio" name="urgency" value="normal"> Normal
                    </label>
                    <label>
                        <input type="radio" name="urgency" value="lent" checked> Lent
                    </label>
                </div>
            </fieldset>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="privacy" name="privacy" required>
                <label for="privacy">J'ai lu et j'accepte la politique de confidentialité du site. <span class="required">*</span></label>
            </div>

            <button type="submit" class="btn-submit">Envoyer</button>

        </form>
    </main>

</body>
</html>
